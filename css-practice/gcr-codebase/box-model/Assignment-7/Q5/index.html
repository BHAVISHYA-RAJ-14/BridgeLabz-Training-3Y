<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Advanced CSS Selectors</h1>
    <ul class="items">
      <li>HTML</li><li>CSS</li><li>JavaScript</li><li>React</li>
    </ul>
    <form>
      <input type="text" placeholder="Text input">
      <input type="email" placeholder="Email input">
    </form>
    <p class="links"><a href="https://example.com">Secure Link</a> <a href="#">Normal Link</a></p>
    <div class="parent"><span>Direct child</span><p><span>Descendant</span></p><span>Sibling</span><span>General sibling</span></div>
  </main>
</body>
</html>
