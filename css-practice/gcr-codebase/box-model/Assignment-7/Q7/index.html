<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typography and Text Styling</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article>
      <h1>Typography in CSS</h1>
      <p class="serif">This paragraph demonstrates a serif font family with comfortable spacing.</p>
      <p class="sans">This paragraph uses a sans-serif font with a different visual style.</p>
      <p class="large">Large text can be used for important information and headings.</p>
      <p>CSS lets us make text <strong>strong</strong>, <em>emphasized</em>, and <mark>highlighted</mark>.</p>
    </article>
  </main>
</body>
</html>
