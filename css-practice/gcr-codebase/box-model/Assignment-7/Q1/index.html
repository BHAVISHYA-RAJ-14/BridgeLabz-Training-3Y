<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Borders & Padding</h1></header>
  <main class="boxes">
    <section class="box solid"><h2>Solid</h2><p>10px padding</p></section>
    <section class="box dashed"><h2>Dashed</h2><p>20px padding</p></section>
    <section class="box double"><h2>Double</h2><p>30px padding</p></section>
    <section class="box groove"><h2>Groove</h2><p>15px padding</p></section>
    <section class="box rounded"><h2>Rounded</h2><p>Border radius</p></section>
  </main>
</body>
</html>
