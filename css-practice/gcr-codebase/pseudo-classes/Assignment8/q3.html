<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header class="gallery-header">
        <h1>My Photography Portfolio</h1>
    </header>
    
    <main class="image-grid">
        <figure class="photo-card">
            <div class="image-box">
                <img src="mountain.jpg" alt="A snowy mountain peak">
                <div class="dark-overlay"></div>
            </div>
            <figcaption>Mountain Peak</figcaption>
        </figure>

        <figure class="photo-card">
            <div class="image-box">
                <img src="forest.jpg" alt="Dense green forest">
                <div class="dark-overlay"></div>
            </div>
            <figcaption>Deep Forest</figcaption>
        </figure>

        <figure class="photo-card">
            <div class="image-box">
                <img src="ocean.jpg" alt="Blue ocean waves">
                <div class="dark-overlay"></div>
            </div>
            <figcaption>Ocean Waves</figcaption>
        </figure>

        <figure class="photo-card">
            <div class="image-box">
                <img src="city.jpg" alt="City skyline at night">
                <div class="dark-overlay"></div>
            </div>
            <figcaption>City Lights</figcaption>
        </figure>

        <figure class="photo-card">
            <div class="image-box">
                <img src="desert.jpg" alt="Sand dunes">
                <div class="dark-overlay"></div>
            </div>
            <figcaption>Sahara Desert</figcaption>
        </figure>

        <figure class="photo-card">
            <div class="image-box">
                <img src="space.jpg" alt="Stars in the night sky">
                <div class="dark-overlay"></div>
            </div>
            <figcaption>Milky Way</figcaption>
        </figure>
    </main>
</body>
</html>
