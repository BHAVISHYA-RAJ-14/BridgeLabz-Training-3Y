<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-Classes Practice</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <main class="demo-wrapper">
        <section class="test-block">
            <!-- hover example -->
            <a href="#" class="my-link">Hover over me!</a>
            <p>The :hover pseudo-class activates when the mouse is over the element.</p>
        </section>

        <section class="test-block">
            <!-- focus and active example -->
            <button class="action-btn">Click or Tab Here</button>
            <p>The :active class triggers on click, and :focus triggers when selected via keyboard.</p>
        </section>

        <section class="test-block">
            <!-- nth-child example -->
            <ul class="fruits-list">
                <li>Apple</li>
                <li>Banana</li>
                <li>Cherry</li>
                <li>Dragonfruit</li>
            </ul>
            <p>Using :nth-child(even) to create a striped list effect.</p>
        </section>
    </main>
</body>
</html>
