<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="06.gallery_style.css">
</head>
<body>
    <h1>Photo Gallery</h1>

    <div class="gallery">
        <div class="photo">
            <img src="https://picsum.photos/400/300?random=1" alt="Nature">
            <div class="caption">Nature</div>
        </div>
        <div class="photo">
            <img src="https://picsum.photos/400/300?random=2" alt="Mountain">
            <div class="caption">Mountain</div>
        </div>
        <div class="photo">
            <img src="https://picsum.photos/400/300?random=3" alt="Forest">
            <div class="caption">Forest</div>
        </div>
        <div class="photo">
            <img src="https://picsum.photos/400/300?random=4" alt="River">
            <div class="caption">River</div>
        </div>
        <div class="photo">
            <img src="https://picsum.photos/400/300?random=5" alt="City">
            <div class="caption">City</div>
        </div>
        <div class="photo">
            <img src="https://picsum.photos/400/300?random=6" alt="Travel">
            <div class="caption">Travel</div>
        </div>
    </div>
</body>
</html>
