<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="05.plans_style.css">
</head>
<body>
    <h1>Choose Your Plan</h1>

    <div class="pricing">
        <div class="plan">
            <h2>Basic</h2>
            <h3>₹199 / Month</h3>
            <ul>
                <li>5 Projects</li>
                <li>Basic Support</li>
                <li>10 GB Storage</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>

        <div class="plan popular">
            <h2>Standard</h2>
            <h3>₹499 / Month</h3>
            <ul>
                <li>15 Projects</li>
                <li>Priority Support</li>
                <li>50 GB Storage</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>

        <div class="plan">
            <h2>Premium</h2>
            <h3>₹899 / Month</h3>
            <ul>
                <li>Unlimited Projects</li>
                <li>Premium Support</li>
                <li>100 GB Storage</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>
    </div>
</body>
</html>
