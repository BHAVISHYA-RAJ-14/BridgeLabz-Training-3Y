<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result 2K26</title>
</head>
<body>
    <h1>Student Result 2026</h1>
    <!-- <table> defines a table container. It must wrap rows and cells. -->
    <!-- Default table behavior: rows stack vertically, with each row containing cells. -->
    <!-- Changing sequence of children inside <table> can break layout if <tr> or <thead>/<tbody> are missing. -->
    <table border="3" cellpadding="8" cellspacing="3">
        <caption>Student Result 2K26</caption>
        <!-- <caption> provides a title for the table. It is rendered above the table by default. -->
        <!-- Using a caption improves accessibility and clearly labels the table content. -->
        <!-- border="1" adds a visible border around cells. Default is 0, which means no border. -->
        <!-- In modern HTML/CSS, use CSS like style="border: 1px solid #000;" instead. -->
        <!-- cellpadding="8" sets the cell padding inside each cell. Default is browser-dependent and usually 1 or 0. -->
        <!-- cellspacing="0" removes spacing between cells. Default is browser-specific and may be nonzero without it. -->
        <thead>
            <!-- <thead> groups header rows. It is optional but improves semantic structure. -->
            <!-- Default browsers may render it identical to <tbody>, but assistive tech can identify it as header content. -->
            <tr>
                <!-- <tr> defines a row. It is typically a child of <thead>, <tbody>, or <tfoot>. -->
                <!-- Default behavior: row cells are laid out horizontally. -->
                <th rowspan="2">Roll No.</th>
                <th rowspan="2">Name</th>
                <th colspan="2">Mark</th>
            </tr>
            <tr>
                <th>CSS</th>
                <th>HTML</th>
            </tr>
        </thead>
        <tbody>
            <!-- <tbody> groups the main body rows. It helps separate header, body, and footer rows. -->
            <tr>
                <td>17</td>
                <!-- <td> is a data cell. It is table-cell display by default. -->
                <td>BH</td>
                <td>99</td>
                <td>99</td>
            </tr>
            <tr>
                <td>23</td>
                <td>HKG</td>
                <td>69</td>
                <td>69</td>
            </tr>
            <tr>
                <td>69</td>
                <td>SP</td>
                <td>00</td>
                <td>00</td>
            </tr>
            <tr>
                <td>103</td>
                <td>A</td>
                <td>76</td>
                <td>76</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
