<!-- There are three common types of comments in HTML: single-line comments, multi-line comments, and documentation comments. -->
<!-- Single-line comments begin with the opening comment marker and end with the closing comment marker. -->
<!-- Multi-line comments can span several lines and are useful for longer explanations. -->
<!-- Documentation comments are used to explain sections of code or provide notes for readers. -->

<!-- The doctype declaration tells the browser that this file is an HTML5 document. -->
<!DOCTYPE html>

<!-- <html> is the root element of the entire HTML page. -->
<html lang="en">

<!-- <head> contains metadata and links to external resources. -->
<head>
    <!-- This line sets the character encoding to UTF-8 for the page. -->
    <meta charset="UTF-8">
    
    <!-- <meta name="description"> gives a short description of the page for search engines. -->
    <meta name="description" content="Class 1 HTML page">
    
    <!-- <meta name="keywords"> provides keywords related to the page. -->
    <meta name="keywords" content="HTML, Class 1, Example">
    
    <!-- This line helps the page adjust correctly for different screen sizes on mobile devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="author" content="BH">
    <link rel="canonical" href="https://www.codeorbit.com/courses/web-development/class-1">

    <!-- 3. Open Graph/social media Meta Tags -->
    <meta property="og:title" content="Class 2">
    <meta property="og:description" content="Class 2 HTML page">
    <meta property="og:image" content="https://www.codeorbit.com/images/class-2.jpg">
    <meta property="og:url" content="https://www.codeorbit.com/courses/web-development/class-2">

    <!-- 4. Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Class 2">
    <meta name="twitter:description" content="Class 2 HTML page">
    <meta name="twitter:image" content="https://www.codeorbit.com/images/class-2.jpg">

    <!-- 5.Performance & Resource Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="prefetch" href="https://www.codeorbit.com/images/class-2.jpg">

    <!-- 6. Favicon & App Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <!-- 7. Stylesheets -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="">

    <!-- <title> shows the text displayed on the browser tab. -->
    <title>Class 2</title>
</head>

<!-- <body> contains the visible content shown to the user. -->
<body>
    <!-- <div> is a container used to group elements together. -->
    <div id="content">
        <!-- <h1> is the main heading of the page. -->
        <h1>Welcome to Class 2</h1>
        
        <!-- <p> is used for paragraphs of text. -->
        <p>This is an example HTML page for Class 2.</p>
        
        <!-- <script> is used to add JavaScript to the page. -->
        <script type="module" src="src/main.js"></script>

    </div>
</body>
</html>
