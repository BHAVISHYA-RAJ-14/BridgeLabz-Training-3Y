<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            width: 300px;
            background-color: wheat;
            border: 1px solid black;
            margin: 0 auto;
        }

        .embed-section {
            max-width: 800px;
            margin: 30px auto;
        }

        iframe {
            width: 100%;
            min-height: 300px;
            border: 1px solid black;
        }
    </style>
</head> 
<body>
    <h1>Registration Form</h1>

    <form action="#" method="post" enctype="multipart/form-data">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="branch">Branch:</label>
            <select id="branch" name="branch" required>
                <option value="">Select a branch</option>
                <option value="cse">CSE</option>
                <option value="it">IT</option>
                <opt value="ece">ECE</opt\ion>
            </select>
        </div>

        <fieldset id="select-skills">
            <legend>Select Skills:</legend>
            <label>
                <input type="checkbox" name="skills" value="java">
                Java
            </label>
            <label>
                <input type="checkbox" name="skills" value="cloud">
                Cloud
            </label>
            <label>
                <input type="checkbox" name="skills" value="null">
                Null
            </label>
        </fieldset>

        <fieldset>
            <legend>Gender:</legend>
            <label>
                <input type="radio" name="gender" value="male" required>
                Male
            </label>
            <label>
                <input type="radio" name="gender" value="female">
                Female
            </label>
            <label>
                <input type="radio" name="gender" value="other">
                Other
            </label>
        </fieldset>

        <div>
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div>
            <label for="file">Upload file:</label>
            <input type="file" id="file" name="file">
        </div>

        <button type="submit">Submit</button>
    </form>

    <section class="embed-section">
        <h2>Our Location</h2>
        <iframe
            src="https://www.google.com/maps?q=BridgeLabz%20Mumbai&output=embed"
            title="Map showing the BridgeLabz Mumbai location"
            loading="lazy"
            allowfullscreen>
        </iframe>
    </section>

    <section class="embed-section">
        <h2>Learn HTML</h2>
        <iframe
            src="https://www.youtube.com/embed/qz0aGYrrlhU?rel=0"
            title="HTML tutorial video"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
    </section>
</body>
</html>
