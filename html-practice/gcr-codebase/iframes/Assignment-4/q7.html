<!DOCTYPE html>
<html>
<head>
    <title>Question 7 - Login Form</title>
</head>
<body>
    <form action="#">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <!-- A CSRF (Cross-Site Request Forgery) token is a unique, secret, and unpredictable value generated by the server. It prevents unauthorized commands from being transmitted from a user that the web application trusts. -->
        <input type="hidden" name="csrf_token" value="dummy_token_abc123">

        <button type="submit">Login</button>
    </form>
</body>
</html>
