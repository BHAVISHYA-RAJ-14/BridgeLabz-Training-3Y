<!DOCTYPE html>
<html>
<head>
    <title>Question 19 - Form Security</title>
</head>
<body>
    <form action="#" autocomplete="off">
        <label for="securedata">Secure Data:</label>
        <input type="text" id="securedata" name="securedata" required><br><br>
        
        <button type="submit">Submit</button>
    </form>

    <p>Note: Turning off autocomplete can improve security by preventing the browser from caching and automatically filling in sensitive information, such as passwords or personal data, on shared or public devices.</p>
</body>
</html>
