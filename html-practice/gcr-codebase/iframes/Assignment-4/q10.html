<!DOCTYPE html>
<html>
<head>
    <title>Question 10 - Contact Form</title>
</head>
<body>
    <form action="#">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="John Doe" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required><br><br>

        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" placeholder="Inquiry about..." required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Type your message here..." required></textarea><br><br>

        <button type="submit">Send Message</button>
    </form>
</body>
</html>
