<!DOCTYPE html>
<html>
<head>
    <title>Question 17 - Form</title>
</head>
<body>
    <!-- The target attribute directs the form submission into the iframe -->
    <form action="result.html" target="result_frame">
        <label for="data">Enter Data:</label>
        <input type="text" id="data" name="data" required><br><br>
        <button type="submit">Submit</button>
    </form>
    <br>
    <iframe name="result_frame" width="400" height="200" title="Form Result"></iframe>
</body>
</html>
