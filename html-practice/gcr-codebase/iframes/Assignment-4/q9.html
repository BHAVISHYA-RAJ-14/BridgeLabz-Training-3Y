<!DOCTYPE html>
<html>
<head>
    <title>Question 9 - File Upload</title>
</head>
<body>
    <form action="#">
        <label for="file">Upload Image:</label>
        <input type="file" id="file" name="file" accept=".jpg, .png" required><br><br>
        
        <p>Note: You can only upload .jpg or .png files.</p>
        
        <button type="submit">Upload</button>
    </form>
</body>
</html>
