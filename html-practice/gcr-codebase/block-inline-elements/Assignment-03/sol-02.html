<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>

    <header>
        <h1>Online Store Product Catalog</h1>
    </header>

    <table border="1">
        <tr>
            <th colspan="4">Available Products</th>
        </tr>

        <tr>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100" alt="Laptop">
                <br>
                Laptop
            </td>
            <td>High-performance laptop for students.</td>
            <td>₹60,000</td>
            <td rowspan="2">In Stock</td>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100" alt="Headphones">
                <br>
                Headphones
            </td>
            <td>Wireless noise-cancelling headphones.</td>
            <td>₹3,000</td>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100" alt="Keyboard">
                <br>
                Keyboard
            </td>
            <td>Mechanical gaming keyboard.</td>
            <td>₹2,500</td>
            <td>Out of Stock</td>
        </tr>
    </table>

</body>
</html>
